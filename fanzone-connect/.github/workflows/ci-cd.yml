# 🏆 FANZONE CONNECT - CI/CD PIPELINE
# Module 01: Git & GitHub Mastery - Advanced DevOps Automation
# World Cup 2026 Fan Platform - Production-Ready Deployment

name: 🚀 FANZONE CONNECT CI/CD

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fanzone-connect
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # 🔍 CODE QUALITY & SECURITY CHECKS
  code-quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔧 Install Dependencies
        run: |
          pip install flake8 black isort mypy bandit safety
          npm install -g eslint prettier @typescript-eslint/parser

      - name: 🎨 Python Code Formatting
        run: |
          black --check backend/
          isort --check-only backend/

      - name: 🔍 Python Linting
        run: |
          flake8 backend/ --max-line-length=88 --extend-ignore=E203,W503
          mypy backend/ --ignore-missing-imports

      - name: 🛡️ Security Scan
        run: |
          bandit -r backend/ -f json -o security-report.json
          safety check --json --output safety-report.json

      - name: 🎨 Frontend Code Formatting
        run: |
          cd frontend
          npm run lint:check
          npm run format:check

  # 🧪 BACKEND TESTING
  backend-tests:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: code-quality
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: fanzone_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: 🧪 Run Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/fanzone_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd backend
          pytest tests/unit/ -v --cov=app --cov-report=xml

      - name: 🔗 Run Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/fanzone_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd backend
          pytest tests/integration/ -v

      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend

  # 🎨 FRONTEND TESTING
  frontend-tests:
    name: 🎨 Frontend Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🧪 Run Unit Tests
        run: |
          cd frontend
          npm run test:coverage

      - name: 🎭 Run E2E Tests
        run: |
          cd frontend
          npm run test:e2e:headless

      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend

  # 🏗️ BUILD & DEPLOY
  build-and-deploy:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build Docker Images
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ github.sha }} ./backend
          docker build -t ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }} ./frontend

      - name: 🚀 Push Docker Images
        run: |
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }}

      - name: 🌍 Deploy to Staging
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🚀 Deploying to staging environment..."
          # Add deployment commands here

      - name: 🏆 Deploy to Production
        if: github.event_name == 'release'
        run: |
          echo "🏆 Deploying to production for World Cup 2026!"
          # Add production deployment commands here
