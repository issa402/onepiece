# ═══════════════════════════════════════════════════════════════════════════════
# 🏆 FANZONE CONNECT - DOCKER COMPOSE CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
# Defines and orchestrates all services needed for FANZONE CONNECT.
# One command (docker-compose up) starts the entire application stack.
#
# USAGE:
#   docker-compose up -d              # Start all services in background
#   docker-compose down               # Stop all services
#   docker-compose logs -f api        # Follow logs for api service
#   docker-compose ps                 # List running services
#   docker-compose exec api bash      # Shell into container
#
# SERVICES DEFINED:
# 1. api-gateway      - Main API entry point (FastAPI)
# 2. user-service     - User management microservice
# 3. match-service    - Match data microservice
# 4. notification-svc - Push notifications
# 5. postgres         - PostgreSQL database
# 6. mongodb          - MongoDB for event store
# 7. redis            - Redis for caching and pub/sub
# 8. nginx            - Reverse proxy and load balancer
#
# LINUX/BASH INTEGRATION:
# - Environment variables from .env file
# - Volume mounts for persistent data
# - Network configuration
# - Health checks for dependencies
# ═══════════════════════════════════════════════════════════════════════════════

