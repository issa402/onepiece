# 🏆 FANZONE CONNECT - DOCKER CONTAINERIZATION
# Module 04: Containerization - Advanced Docker & Kubernetes Setup
# World Cup 2026 Fan Platform - Production-Ready Container Orchestration

version: '3.8'

services:
  # =====================================================
  # DATABASE SERVICES
  # =====================================================
  
  postgres:
    image: postgis/postgis:15-3.3
    container_name: fanzone-postgres
    environment:
      POSTGRES_DB: fanzone_connect
      POSTGRES_USER: fanzone_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worldcup2026}
      POSTGRES_MULTIPLE_DATABASES: fanzone_test,fanzone_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql/init:/docker-entrypoint-initdb.d
      - ./database/postgresql/schemas:/schemas
    ports:
      - "5432:5432"
    networks:
      - fanzone-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanzone_user -d fanzone_connect"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    container_name: fanzone-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - fanzone-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:7
    container_name: fanzone-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: fanzone_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-worldcup2026}
      MONGO_INITDB_DATABASE: fanzone_events
    volumes:
      - mongodb_data:/data/db
      - ./database/mongodb/init:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    networks:
      - fanzone-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: fanzone-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - fanzone-network

  # =====================================================
  # BACKEND MICROSERVICES
  # =====================================================

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: fanzone-api-gateway
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-worldcup2026secret}
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    networks:
      - fanzone-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    build:
      context: ./backend/services/user-service
      dockerfile: Dockerfile
    container_name: fanzone-user-service
    environment:
      - DATABASE_URL=postgresql://fanzone_user:${POSTGRES_PASSWORD:-worldcup2026}@postgres:5432/fanzone_connect
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-worldcup2026secret}
    depends_on:
      - postgres
      - redis
    networks:
      - fanzone-network
    deploy:
      replicas: 2

  event-service:
    build:
      context: ./backend/services/event-service
      dockerfile: Dockerfile
    container_name: fanzone-event-service
    environment:
      - DATABASE_URL=postgresql://fanzone_user:${POSTGRES_PASSWORD:-worldcup2026}@postgres:5432/fanzone_connect
      - MONGODB_URL=mongodb://fanzone_admin:${MONGO_PASSWORD:-worldcup2026}@mongodb:27017/fanzone_events
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - postgres
      - mongodb
      - elasticsearch
    networks:
      - fanzone-network

  accommodation-service:
    build:
      context: ./backend/services/accommodation-service
      dockerfile: Dockerfile
    container_name: fanzone-accommodation-service
    environment:
      - DATABASE_URL=postgresql://fanzone_user:${POSTGRES_PASSWORD:-worldcup2026}@postgres:5432/fanzone_connect
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - postgres
      - redis
      - elasticsearch
    networks:
      - fanzone-network

  ai-service:
    build:
      context: ./backend/services/ai-service
      dockerfile: Dockerfile
    container_name: fanzone-ai-service
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - MODEL_CACHE_DIR=/app/models
    volumes:
      - ai_models:/app/models
    depends_on:
      - redis
    networks:
      - fanzone-network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  # =====================================================
  # FRONTEND SERVICES
  # =====================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: fanzone-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:8000
      - NEXT_PUBLIC_WS_URL=ws://websocket-server:3001
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - fanzone-network

  websocket-server:
    build:
      context: ./backend/websocket-server
      dockerfile: Dockerfile
    container_name: fanzone-websocket
    environment:
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-worldcup2026secret}
    ports:
      - "3001:3001"
    depends_on:
      - redis
    networks:
      - fanzone-network

  # =====================================================
  # MONITORING & OBSERVABILITY
  # =====================================================

  nginx:
    image: nginx:alpine
    container_name: fanzone-nginx
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - api-gateway
    networks:
      - fanzone-network

  prometheus:
    image: prom/prometheus:latest
    container_name: fanzone-prometheus
    volumes:
      - ./config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - fanzone-network

  grafana:
    image: grafana/grafana:latest
    container_name: fanzone-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-worldcup2026}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3001:3000"
    networks:
      - fanzone-network

# =====================================================
# NETWORKS & VOLUMES
# =====================================================

networks:
  fanzone-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  elasticsearch_data:
    driver: local
  ai_models:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
