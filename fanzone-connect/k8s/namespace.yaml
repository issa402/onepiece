# 🏆 FANZONE CONNECT - KUBERNETES NAMESPACE
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
# Creates an isolated namespace for all FANZONE CONNECT resources.
# Namespaces let you run multiple environments (dev, staging, prod) in same cluster.
#
# USAGE:
#   kubectl apply -f namespace.yaml
#   kubectl get namespaces
#
# WHY NAMESPACES:
# - Resource isolation between environments
# - Access control (RBAC) at namespace level
# - Resource quotas per namespace
# - Easier cleanup (delete namespace = delete everything in it)
# ═══════════════════════════════════════════════════════════════════════════════

