# ═══════════════════════════════════════════════════════════════════════════════
# 🏆 FANZONE CONNECT - HORIZONTAL POD AUTOSCALER (HPA)
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
# Automatically scales pods based on CPU/memory usage or custom metrics.
# During World Cup matches, traffic spikes → HPA adds more pods automatically.
#
# WHY HPA:
# - Handle traffic spikes without manual intervention
# - Save money during low traffic (scale down)
# - Maintain performance SLAs
# - React to real-time demand
#
# PREREQUISITES:
# - Metrics Server installed in cluster
# - Resource requests defined in deployments
#
# USAGE:
#   kubectl apply -f hpa.yaml
#   kubectl get hpa -n fanzone-connect
#   kubectl describe hpa api-gateway-hpa -n fanzone-connect
# ═══════════════════════════════════════════════════════════════════════════════

