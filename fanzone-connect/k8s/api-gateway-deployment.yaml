# 🏆 FANZONE CONNECT - API GATEWAY DEPLOYMENT
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
# Deploys the API Gateway service to Kubernetes.
# Manages replicas, rolling updates, health checks, and resource limits.
#
# USAGE:
#   kubectl apply -f api-gateway-deployment.yaml
#   kubectl get deployments -n fanzone-connect
#   kubectl rollout status deployment/api-gateway -n fanzone-connect
#
# KEY CONCEPTS:
# - Deployment: Manages ReplicaSets and Pods
# - ReplicaSet: Ensures desired number of pod replicas
# - Pod: Smallest deployable unit (one or more containers)
# - Rolling Update: Zero-downtime deployments
# ═══════════════════════════════════════════════════════════════════════════════

