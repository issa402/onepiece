# 🏆 FANZONE CONNECT - KUBERNETES INGRESS
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
# Ingress manages external HTTP/HTTPS access to services.
# Acts as a smart router - routes traffic based on hostname and path.
#
# WHY INGRESS:
# - Single entry point (one IP/load balancer for many services)
# - Path-based routing (/api → api-gateway, /admin → admin-service)
# - Host-based routing (api.fanzone.com, admin.fanzone.com)
# - SSL/TLS termination
# - Rate limiting, authentication (with annotations)
#
# PREREQUISITES:
# - Ingress Controller installed (nginx-ingress, traefik, etc.)
# - cert-manager for automatic SSL (optional)
#
# USAGE:
#   kubectl apply -f ingress.yaml
#   kubectl get ingress -n fanzone-connect
# ═══════════════════════════════════════════════════════════════════════════════

