# 🏆 FANZONE CONNECT - POSTGRESQL STATEFULSET
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
# Runs PostgreSQL as a StatefulSet for persistent, ordered deployment.
# StatefulSets are for stateful apps that need stable network identity and storage.
#
# WHY STATEFULSET (not Deployment):
# - Stable pod names (postgres-0, postgres-1, not random)
# - Ordered deployment and scaling
# - Persistent storage that survives pod restarts
# - Stable network identity for replication
#
# USAGE:
#   kubectl apply -f postgres-statefulset.yaml
#   kubectl get statefulsets -n fanzone-connect
#   kubectl exec -it postgres-0 -n fanzone-connect -- psql -U fanzone
# ═══════════════════════════════════════════════════════════════════════════════

