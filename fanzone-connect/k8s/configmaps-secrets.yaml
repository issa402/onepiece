# ═══════════════════════════════════════════════════════════════════════════════
# 🏆 FANZONE CONNECT - CONFIGMAPS & SECRETS
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
# ConfigMaps: Store non-sensitive configuration data
# Secrets: Store sensitive data (passwords, API keys, certificates)
#
# WHY SEPARATE FROM CODE:
# - Change config without rebuilding images
# - Different configs for dev/staging/prod
# - Secrets encrypted at rest in etcd
# - RBAC control over who can read secrets
#
# USAGE:
#   kubectl apply -f configmaps-secrets.yaml
#   kubectl get configmaps -n fanzone-connect
#   kubectl get secrets -n fanzone-connect
# ═══════════════════════════════════════════════════════════════════════════════

